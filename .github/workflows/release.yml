name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version from tag
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          # Git allows surprising characters in tag names. Reject anything
          # that isn't a strict semver-ish identifier so downstream node -e
          # / shell interpolations can't be turned into command injection
          # by a malicious tag push.
          if ! [[ "$version" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Refusing tag with unsafe characters: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No `version:` here on purpose. The action reads `packageManager` from
      # package.json, and refuses outright when both are set — which is how
      # the first v2.0.0 tag failed.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - run: pnpm install

      - name: Sync manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      # We invoke vite directly (not `pnpm build` → `vttforge build`) because
      # the release workflow needs to:
      #   1. Run vite build → emit dist/module.json
      #   2. Patch manifest/download URLs into dist/module.json
      #   3. Zip dist/ → release artifact (so the zipped manifest carries URLs)
      # `vttforge build` zips at step 1, which would freeze the un-patched
      # manifest. Eventually the vite-plugin will support env-driven URL
      # injection and this dance disappears.
      - run: pnpm exec vite build

      - name: Inject release URLs into manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          PKG_ID: 'pdf-character-sheet'
        run: |
          node -e "const fs=require('node:fs');const path='dist/module.json';const m=JSON.parse(fs.readFileSync(path,'utf8'));const r=process.env.REPO;const v=process.env.VERSION;const id=process.env.PKG_ID;m.manifest=\`https://github.com/\${r}/releases/latest/download/module.json\`;m.download=\`https://github.com/\${r}/releases/download/v\${v}/\${id}-\${v}.zip\`;fs.writeFileSync(path,JSON.stringify(m,null,2)+'\n');"

      - name: Build release zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PKG_ID: 'pdf-character-sheet'
        run: |
          cd dist
          zip -r "../${PKG_ID}-${VERSION}.zip" .

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PKG_ID: 'pdf-character-sheet'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.PKG_ID }}-${{ env.VERSION }}.zip
            dist/module.json
          generate_release_notes: true
          body: |
            ## Foundry installation

            Install via Foundry's setup wizard with this manifest URL:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/module.json
            ```

      # foundryvtt.com keeps its own list of versions. A version with no entry
      # there cannot be installed from the site and offers nobody an update.
      # That list sat four versions behind, because the form is filled by hand.
      #
      # Last, because the site fetches the manifest to validate the entry, and
      # that file is a release asset: before the step above it is a 404.
      #
      # The manifest URL names this tag rather than `latest`. An entry describes
      # one version, and a moving URL would make every old entry install the
      # newest build. Compatibility comes out of the manifest that was just
      # built, so the site and the package cannot drift apart.
      - name: Register the version on foundryvtt.com
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          PKG_ID: 'pdf-character-sheet'
          TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::FOUNDRY_RELEASE_TOKEN is not set. Take the Package Release Token from the package edit page and run: gh secret set FOUNDRY_RELEASE_TOKEN"
            exit 1
          fi
          payload="$(jq -n \
            --arg id "$PKG_ID" \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/$REPO/releases/download/v$VERSION/module.json" \
            --arg notes "https://github.com/$REPO/releases/tag/v$VERSION" \
            --arg minimum "$(jq -r '.compatibility.minimum' dist/module.json)" \
            --arg verified "$(jq -r '.compatibility.verified' dist/module.json)" \
            '{id: $id, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: {minimum: $minimum, verified: $verified}}}')"
          # The answer is printed before it is judged. A refusal explains itself
          # in the body, and a step that shows only the status code hides why.
          answer="$(mktemp)"
          code="$(curl -sS -o "$answer" -w '%{http_code}' \
            -X POST 'https://foundryvtt.com/_api/packages/release_version/' \
            -H 'Content-Type: application/json' \
            -H "Authorization: $TOKEN" \
            --data-binary "$payload")"
          cat "$answer"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::foundryvtt.com answered $code"
            exit 1
          fi
