name: E2E

# Foundry itself, in a container, running this module.
#
# Not on `pull_request`, deliberately. The felddy image downloads a licensed
# Foundry, so this job needs credentials, and GitHub does not hand secrets to
# a workflow triggered from a fork.
#
# It runs on a hosted runner with nothing cached between runs, so every run
# pays the Foundry download. Expect around ten minutes.
on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  foundry:
    name: Foundry v14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
    steps:
      - name: Check the credentials are configured
        run: |
          missing=""
          for name in FOUNDRY_LICENSE_KEY FOUNDRY_USERNAME FOUNDRY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them with: gh secret set <NAME> --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # The harness copies `dist/` into the container, so the module has to be
      # built first.
      - name: Build
        run: bunx vite build

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Run
        run: bun run test:e2e

      - name: Foundry logs on failure
        if: failure()
        run: docker logs --tail 200 pdf-character-sheet-e2e || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Stop Foundry
        if: always()
        # The named volume outlives the run on purpose: it holds the licensed
        # Foundry download, which is otherwise fetched again every time.
        run: docker rm -f pdf-character-sheet-e2e || true
